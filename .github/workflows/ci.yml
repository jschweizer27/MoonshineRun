# Runs on every push to main and every pull request: syntax check, lint, build, and the
# automated playtests in a real (software-rendered) browser. Screenshots of the game are
# uploaded with every run so changes can be seen without running anything.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Check, build and playtest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax + vendored Three.js check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Build (website + single-file offline game)
        run: npm run build
        env:
          SHINE_BUILD_ID: ${{ github.sha }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Playtests
        run: npm test

      - name: Job summary
        if: always()
        run: node scripts/ci-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Upload gameplay screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gameplay-screenshots
          path: artifacts/screenshots/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Upload playable build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: shine-offline
          path: dist/Shine.html
          retention-days: 14
