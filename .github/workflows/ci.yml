# Runs on every push to main and every pull request: syntax check, lint, build, and the
# automated playtests in a real (software-rendered) browser. Screenshots of the game are
# uploaded with every run so changes can be seen without running anything.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax, vendored Three.js and UE5 static checks
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Build (website + single-file offline game)
        run: npm run build
        env:
          SHINE_BUILD_ID: ${{ github.sha }}

      - name: Upload playable build
        uses: actions/upload-artifact@v7
        with:
          name: shine-offline
          path: dist/Shine.html
          retention-days: 14

  # The playtests render in software and take well over half an hour in one go, so they
  # run in five parallel shards (each well inside the time limit, retries included).
  playtest:
    name: Playtest (${{ matrix.shard }}/5)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (the dist tests play the built game)
        run: npm run build
        env:
          SHINE_BUILD_ID: ${{ github.sha }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Playtests
        run: npm test -- --shard=${{ matrix.shard }}/5

      - name: Job summary
        if: always()
        run: node scripts/ci-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Upload gameplay screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gameplay-screenshots-${{ matrix.shard }}
          path: artifacts/screenshots/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
