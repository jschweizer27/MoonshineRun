# The robot playthrough (scripts/playthrough.mjs): a bot plays a new game from the title screen
# to all three endings and reports anything that got stuck, dead-ended or errored. It takes
# a long while in a software-rendered browser, so it runs only when started by hand
# (Actions → Playthrough → Run workflow). The report, the shots and the contact sheet are
# uploaded as an artifact.
name: Playthrough

on:
  workflow_dispatch:
    inputs:
      seed:
        description: 'World seed (blank: the default layout)'
        required: false
        default: ''
      police:
        description: 'The Bureau and Vail''s men (on / off)'
        required: false
        default: 'on'

permissions:
  contents: read

jobs:
  playthrough:
    name: Robot playthrough
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Play it through
        run: npm run playthrough -- ci ${{ inputs.seed && format('--seed {0}', inputs.seed) || '' }} --police ${{ inputs.police }} --minutes 140

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playthrough
          path: artifacts/playthrough/ci
          retention-days: 14
